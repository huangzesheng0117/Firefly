  <rect x="533" y="310" width="414" height="181" rx="22" fill="#fff7ea" stroke="#eccb98"/><text x="557" y="342" class="label">Private-Circuit Egress</text>
  <rect x="584" y="362" width="312" height="48" rx="12" class="node"/><rect x="604" y="374" width="34" height="24" rx="5" class="pair"/><rect x="645" y="374" width="34" height="24" rx="5" class="pair"/><text x="789" y="392" text-anchor="middle" class="label">Private-Line Switch IRF</text>
  <rect x="584" y="429" width="312" height="48" rx="12" class="node"/><rect x="604" y="441" width="34" height="24" rx="5" class="pair"/><rect x="645" y="441" width="34" height="24" rx="5" class="pair"/><text x="789" y="459" text-anchor="middle" class="label">Private-Line Firewall HA</text>

