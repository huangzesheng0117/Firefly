  <rect width="1480" height="1120" fill="#f7fafc"/>
  <text x="52" y="54" class="title">Campus Office Network: End-to-End Logical Topology</text>
  <text x="52" y="84" class="subtitle">Three traffic egress paths, dual-member core, aggregation/access layers, and an independent operations plane</text>

  <rect x="40" y="112" width="1400" height="146" rx="22" fill="#edf3f8" stroke="#d3dee8"/>
  <text x="64" y="142" class="section">EXTERNAL NETWORKS</text>
  <rect x="94" y="166" width="150" height="58" rx="16" class="node"/><text x="169" y="192" text-anchor="middle" class="label">Carrier A</text><text x="169" y="213" text-anchor="middle" class="small">Internet circuit</text>
  <rect x="268" y="166" width="150" height="58" rx="16" class="node"/><text x="343" y="192" text-anchor="middle" class="label">Carrier B</text><text x="343" y="213" text-anchor="middle" class="small">Internet circuit</text>
  <rect x="574" y="166" width="150" height="58" rx="16" class="node"/><text x="649" y="192" text-anchor="middle" class="label">Service DC A</text><text x="649" y="213" text-anchor="middle" class="small">Private circuit</text>
  <rect x="748" y="166" width="150" height="58" rx="16" class="node"/><text x="823" y="192" text-anchor="middle" class="label">Service DC B</text><text x="823" y="213" text-anchor="middle" class="small">Private circuit</text>
