<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17365d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2f78c4"/>
    </marker>
    <style>
      .title{font:700 36px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102f52}
      .subtitle{font:18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#607a99}
      .node-title{font:700 23px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14365c}
      .node-sub{font:16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#55708e}
      .line-label{font:17px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#2f5f92}
      .callout-title{font:700 21px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#9b3c24}
      .callout-sub{font:16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#7c5260}
    </style>
  </defs>

  <rect width="1500" height="900" fill="#f7f9fc"/>
  <text x="60" y="65" class="title">SIP 语音业务逻辑链路</text>
  <text x="60" y="100" class="subtitle">呼叫信令可以建立，但 RTP 媒体未形成双向通信</text>

  <rect x="495" y="135" width="510" height="88" rx="18" fill="#ffffff" stroke="#bdd2e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="170" text-anchor="middle" class="node-title">办公电脑 / 电话终端</text>
  <text x="750" y="199" text-anchor="middle" class="node-sub">发起或接收呼叫</text>

  <line x1="750" y1="223" x2="750" y2="290" stroke="#2f78c4" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="785" y="263" class="line-label">SIP 信令 + RTP 语音</text>

  <rect x="495" y="300" width="510" height="88" rx="18" fill="#eaf3ff" stroke="#78a9db" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="335" text-anchor="middle" class="node-title">注册 VIP（虚拟入口）</text>
  <text x="750" y="364" text-anchor="middle" class="node-sub">统一承接注册与呼叫请求</text>

  <line x1="750" y1="388" x2="750" y2="430" stroke="#2f78c4" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <rect x="495" y="440" width="510" height="88" rx="18" fill="#ffffff" stroke="#bdd2e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="475" text-anchor="middle" class="node-title">注册 FS（FreeSWITCH 集群）</text>
  <text x="750" y="504" text-anchor="middle" class="node-sub">处理注册、呼叫控制与媒体协商</text>

  <line x1="750" y1="528" x2="750" y2="570" stroke="#2f78c4" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <rect x="495" y="580" width="510" height="88" rx="18" fill="#ffffff" stroke="#bdd2e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="615" text-anchor="middle" class="node-title">注册 FS 真实后端</text>
  <text x="750" y="644" text-anchor="middle" class="node-sub">实际承载会话与 RTP 媒体</text>

  <line x1="750" y1="668" x2="750" y2="710" stroke="#2f78c4" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <rect x="495" y="720" width="510" height="70" rx="18" fill="#ffffff" stroke="#bdd2e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="764" text-anchor="middle" class="node-title">中继网关</text>

  <line x1="750" y1="790" x2="750" y2="824" stroke="#2f78c4" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <rect x="495" y="834" width="510" height="54" rx="18" fill="#eaf8f0" stroke="#7ac69d" stroke-width="2"/>
  <text x="750" y="869" text-anchor="middle" class="node-title">运营商电话网 / 外部号码</text>

  <rect x="1055" y="215" width="355" height="142" rx="18" fill="#fff4ef" stroke="#e46d4e" stroke-width="2" filter="url(#shadow)"/>
  <text x="1232" y="255" text-anchor="middle" class="callout-title">集团机房防火墙</text>
  <text x="1232" y="289" text-anchor="middle" class="callout-sub">链路上的配置变更点</text>
  <text x="1232" y="321" text-anchor="middle" class="callout-sub">SIP ALG：开启 → 关闭</text>
  <path d="M1055 286 C980 286 920 270 760 270" fill="none" stroke="#e46d4e" stroke-width="3" stroke-dasharray="8 7"/>
</svg>
