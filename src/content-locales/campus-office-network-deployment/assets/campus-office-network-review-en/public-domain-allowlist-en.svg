<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17365d" flood-opacity="0.12"/></filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f78c4"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7257d8"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2b9b64"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#df4b4b"/></marker>
    <style>text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700;fill:#102f52}.subtitle{font-size:18px;fill:#607a99}.node-title{font-size:23px;font-weight:700;fill:#14365c}.node-sub{font-size:16px;fill:#55708e}.label{font-size:17px;fill:#506d8b}.metric{font-size:18px;font-weight:700;fill:#9b5a16}</style>
  </defs>
  <rect width="1500" height="650" fill="#f7f9fc"/><text x="60" y="65" class="title">Public Domain Allowlist Logic</text><text x="60" y="100" class="subtitle">Designated DNS provides resolution; the Internet firewall learns dynamic addresses and enforces access policy</text>
  <rect x="80" y="285" width="280" height="104" rx="18" fill="#fff" stroke="#bdd2e8" stroke-width="2" filter="url(#shadow)"/><text x="220" y="328" text-anchor="middle" class="node-title" style="font-size:20px">Restricted Office Endpoints</text><text x="220" y="360" text-anchor="middle" class="node-sub">Approved domains only</text>
  <rect x="455" y="135" width="280" height="104" rx="18" fill="#f0edff" stroke="#a996e8" stroke-width="2" filter="url(#shadow)"/><text x="595" y="178" text-anchor="middle" class="node-title">Designated DNS</text><text x="595" y="210" text-anchor="middle" class="node-sub">Central resolution service</text>
  <path d="M350 295 C410 235 445 210 455 200" fill="none" stroke="#7257d8" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/><text x="345" y="230" class="label">DNS query</text>
  <rect x="560" y="285" width="380" height="150" rx="20" fill="#fff7e8" stroke="#e8a541" stroke-width="3" filter="url(#shadow)"/><text x="750" y="327" text-anchor="middle" class="node-title">Internet Firewall HA</text><text x="750" y="360" text-anchor="middle" class="node-sub">DNS snooping · Domain address book</text><text x="750" y="391" text-anchor="middle" class="node-sub">Allow allowlist matches · Deny all others</text>
  <path d="M735 200 C790 205 805 245 805 285" fill="none" stroke="#7257d8" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/><text x="795" y="238" class="label">Learn DNS answers</text>
  <line x1="360" y1="350" x2="560" y2="350" stroke="#2f78c4" stroke-width="5" marker-end="url(#arrow-blue)"/><text x="405" y="333" class="label">Internet connection</text>
  <rect x="1080" y="185" width="330" height="104" rx="18" fill="#eaf8f0" stroke="#77c59a" stroke-width="2" filter="url(#shadow)"/><text x="1245" y="228" text-anchor="middle" class="node-title">Allowlisted Domain</text><text x="1245" y="260" text-anchor="middle" class="node-sub">Business connection permitted</text>
  <rect x="1080" y="405" width="330" height="104" rx="18" fill="#fff0f0" stroke="#e28a8a" stroke-width="2" filter="url(#shadow)"/><text x="1245" y="448" text-anchor="middle" class="node-title">Other Public Domain</text><text x="1245" y="480" text-anchor="middle" class="node-sub">Default deny and log</text>
  <path d="M940 335 C995 315 1020 250 1080 237" fill="none" stroke="#2b9b64" stroke-width="5" marker-end="url(#arrow-green)"/><text x="974" y="280" class="label">Allowlist match</text><path d="M940 385 C995 405 1020 457 1080 457" fill="none" stroke="#df4b4b" stroke-width="5" marker-end="url(#arrow-red)"/><text x="974" y="430" class="label">No match</text>
  <rect x="535" y="505" width="430" height="86" rx="17" fill="#fff" stroke="#edc687" stroke-width="2"/><text x="750" y="540" text-anchor="middle" class="metric">Wildcard domains: 231 / 233</text><text x="750" y="570" text-anchor="middle" class="node-sub">Device-wide limit: 128 → 256</text>
</svg>
