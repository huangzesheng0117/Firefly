  <rect x="105" y="362" width="312" height="48" rx="12" class="node"/><rect x="125" y="374" width="34" height="24" rx="5" class="pair"/><rect x="166" y="374" width="34" height="24" rx="5" class="pair"/><text x="310" y="392" text-anchor="middle" class="label">Egress Switch IRF</text>
  <rect x="105" y="429" width="312" height="48" rx="12" class="node"/><rect x="125" y="441" width="34" height="24" rx="5" class="pair"/><rect x="166" y="441" width="34" height="24" rx="5" class="pair"/><text x="310" y="459" text-anchor="middle" class="label">Internet Firewall HA</text>
