<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">割接阶段三：CR16000-2 下线</title>
  <desc id="desc">第二台旧设备隔离后，出口由 CR19000-1 承担；2 侧客户经核心横联转到 1 侧。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17334d" flood-opacity=".14"/>
    </filter>
    <marker id="flowArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#0891b2"/>
    </marker>
    <marker id="peerArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .t{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#14283c}
      .title{font-size:31px;font-weight:700}
      .sub{font-size:15px;fill:#62758a}
      .layer{font-size:14px;font-weight:700;fill:#64748b;letter-spacing:1px}
      .boxTitle{font-size:19px;font-weight:700}
      .boxSub{font-size:13px;fill:#607387}
      .white{fill:#fff}
      .operator{fill:#fff;stroke:#cbd8e6;stroke-width:2}
      .customer{fill:#fff;stroke:#cbd8e6;stroke-width:2}
      .coreBox{fill:url(#core)}
      .routerBox{fill:url(#router)}
      .activeBox{fill:#0f766e;stroke:#0b5f59;stroke-width:2}
      .mixedBox{fill:#1d4ed8;stroke:#1e40af;stroke-width:2}
      .downBox{fill:#e5e7eb;stroke:#94a3b8;stroke-width:2}
      .flow{fill:none;stroke:#0891b2;stroke-width:5;marker-start:url(#flowArrow);marker-end:url(#flowArrow)}
      .flowThin{fill:none;stroke:#0891b2;stroke-width:4;marker-start:url(#flowArrow);marker-end:url(#flowArrow)}
      .peer{fill:none;stroke:#7c3aed;stroke-width:4;stroke-dasharray:9 7;marker-start:url(#peerArrow);marker-end:url(#peerArrow)}
      .normal{fill:none;stroke:#64748b;stroke-width:3}
      .single{fill:none;stroke:#f59e0b;stroke-width:4}
      .down{fill:none;stroke:#a8b1bd;stroke-width:3;stroke-dasharray:9 8}
      .small{font-size:12px;fill:#64748b}
      .note{fill:#fff7ed;stroke:#fdba74;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="860" rx="26" fill="url(#bg)"/>
  <text x="65" y="58" text-anchor="start" class="t title">割接阶段三：CR16000-2 下线</text>
  <text x="65" y="88" text-anchor="start" class="t sub">第二台旧设备隔离后，出口由 CR19000-1 承担；2 侧客户经核心横联转到 1 侧。</text>

  <rect x="350" y="120" width="900" height="78" rx="16" class="operator" filter="url(#shadow)"/>
  <text x="800" y="167" text-anchor="middle" class="t boxTitle">运营商出口</text>

  <path d="M410 198 L410 270" class="flow"/>
  <path d="M1190 198 L1190 270" class="down"/>
  <path d="M590 320 L1010 320" class="down"/>

  <rect x="230" y="270" width="360" height="100" rx="18" class="activeBox" filter="url(#shadow)"/>
  <rect x="1010" y="270" width="360" height="100" rx="18" class="downBox" filter="url(#shadow)"/>
  <text x="410" y="311" text-anchor="middle" class="t boxTitle white">CR19000-1</text>
  <text x="410" y="344" text-anchor="middle" class="t white">现网单机承载</text>
  <text x="1190" y="311" text-anchor="middle" class="t boxTitle ">CR16000-2</text>
  <text x="1190" y="344" text-anchor="middle" class="t boxSub">已隔离 / 待下架</text>

  <path d="M410 370 C410 445 230 435 230 500" class="flowThin"/>
  <path d="M410 370 C410 445 610 435 610 500" class="flowThin"/>
  <path d="M1190 370 C1190 445 990 435 990 500" class="down"/>
  <path d="M1190 370 C1190 445 1370 435 1370 500" class="down"/>

  <path d="M390 535 C535 435 845 435 830 535" class="peer"/>
  <path d="M770 565 C915 665 1225 665 1210 565" class="peer"/>
  <text x="610" y="438" text-anchor="middle" class="t small">单线流量经 fixed 横联绕行</text>
  <text x="990" y="667" text-anchor="middle" class="t small">多线流量经 BGP 横联绕行</text>

  <rect x="70" y="500" width="320" height="90" rx="16" class="coreBox" filter="url(#shadow)"/>
  <rect x="450" y="500" width="320" height="90" rx="16" class="coreBox" filter="url(#shadow)"/>
  <rect x="830" y="500" width="320" height="90" rx="16" class="coreBox" filter="url(#shadow)"/>
  <rect x="1210" y="500" width="320" height="90" rx="16" class="coreBox" filter="url(#shadow)"/>
  <text x="230" y="553" text-anchor="middle" class="t boxTitle white">fixed-1</text>
  <text x="610" y="553" text-anchor="middle" class="t boxTitle white">bgp-1</text>
  <text x="990" y="553" text-anchor="middle" class="t boxTitle white">fixed-2</text>
  <text x="1370" y="553" text-anchor="middle" class="t boxTitle white">bgp-2</text>

  <path d="M230 590 L230 730" class="flowThin"/>
  <path d="M610 590 L610 730" class="flowThin"/>
  <path d="M990 590 L990 730" class="flowThin"/>
  <path d="M1370 590 L1370 730" class="flowThin"/>
  <rect x="80" y="730" width="300" height="72" rx="16" class="customer" filter="url(#shadow)"/>
  <rect x="460" y="730" width="300" height="72" rx="16" class="customer" filter="url(#shadow)"/>
  <rect x="840" y="730" width="300" height="72" rx="16" class="customer" filter="url(#shadow)"/>
  <rect x="1220" y="730" width="300" height="72" rx="16" class="customer" filter="url(#shadow)"/>
  <text x="230" y="774" text-anchor="middle" class="t boxTitle">1 侧单线客户</text>
  <text x="610" y="774" text-anchor="middle" class="t boxTitle">1 侧 BGP 客户</text>
  <text x="990" y="774" text-anchor="middle" class="t boxTitle">2 侧单线客户</text>
  <text x="1370" y="774" text-anchor="middle" class="t boxTitle">2 侧 BGP 客户</text>

  <rect x="65" y="880" width="1470" height="38" rx="10" class="note"/>
  <text x="85" y="905" text-anchor="start" class="t boxSub">阶段结束状态：2 号旧设备已隔离，全部业务暂由 CR19000-1 承载。</text>
  <path d="M1170 92 L1220 92" class="flowThin"/>
  <text x="1235" y="97" text-anchor="start" class="t small">双向业务流量</text>
  <path d="M1375 92 L1425 92" class="peer"/>
  <text x="1440" y="97" text-anchor="start" class="t small">横联绕行</text>
  </svg>
