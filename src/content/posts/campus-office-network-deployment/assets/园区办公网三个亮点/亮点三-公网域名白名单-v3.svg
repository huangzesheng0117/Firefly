<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17365d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f78c4"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7257d8"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2b9b64"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#df4b4b"/></marker>
    <style>
      .title{font:700 36px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102f52}
      .subtitle{font:18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#607a99}
      .node-title{font:700 23px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14365c}
      .node-sub{font:16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#55708e}
      .label{font:17px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#506d8b}
      .metric{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#9b5a16}
    </style>
  </defs>

  <rect width="1500" height="650" fill="#f7f9fc"/>
  <text x="60" y="65" class="title">公网域名白名单逻辑</text>
  <text x="60" y="100" class="subtitle">指定 DNS 提供解析结果，互联网防火墙完成动态地址学习与访问控制</text>

  <rect x="80" y="285" width="280" height="104" rx="18" fill="#ffffff" stroke="#bdd2e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="328" text-anchor="middle" class="node-title">受控办公终端</text>
  <text x="220" y="360" text-anchor="middle" class="node-sub">仅允许访问批准域名</text>

  <rect x="455" y="135" width="280" height="104" rx="18" fill="#f0edff" stroke="#a996e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="595" y="178" text-anchor="middle" class="node-title">指定 DNS</text>
  <text x="595" y="210" text-anchor="middle" class="node-sub">统一解析入口</text>

  <path d="M350 295 C410 235 445 210 455 200" fill="none" stroke="#7257d8" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/>
  <text x="345" y="230" class="label">DNS 查询</text>

  <rect x="560" y="285" width="380" height="150" rx="20" fill="#fff7e8" stroke="#e8a541" stroke-width="3" filter="url(#shadow)"/>
  <text x="750" y="327" text-anchor="middle" class="node-title">互联网防火墙 HA</text>
  <text x="750" y="360" text-anchor="middle" class="node-sub">DNS Snooping · 域名地址簿</text>
  <text x="750" y="391" text-anchor="middle" class="node-sub">白名单放行 · 其他访问拒绝</text>

  <path d="M735 200 C790 205 805 245 805 285" fill="none" stroke="#7257d8" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/>
  <text x="795" y="238" class="label">解析结果学习</text>

  <line x1="360" y1="350" x2="560" y2="350" stroke="#2f78c4" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="405" y="333" class="label">公网连接</text>

  <rect x="1080" y="185" width="330" height="104" rx="18" fill="#eaf8f0" stroke="#77c59a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1245" y="228" text-anchor="middle" class="node-title">白名单域名</text>
  <text x="1245" y="260" text-anchor="middle" class="node-sub">允许建立业务连接</text>

  <rect x="1080" y="405" width="330" height="104" rx="18" fill="#fff0f0" stroke="#e28a8a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1245" y="448" text-anchor="middle" class="node-title">其他公网域名</text>
  <text x="1245" y="480" text-anchor="middle" class="node-sub">兜底拒绝并记录日志</text>

  <path d="M940 335 C995 315 1020 250 1080 237" fill="none" stroke="#2b9b64" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="974" y="280" class="label">命中白名单</text>

  <path d="M940 385 C995 405 1020 457 1080 457" fill="none" stroke="#df4b4b" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="974" y="430" class="label">未命中</text>

  <rect x="535" y="505" width="430" height="86" rx="17" fill="#ffffff" stroke="#edc687" stroke-width="2"/>
  <text x="750" y="540" text-anchor="middle" class="metric">通配域名：231 / 233</text>
  <text x="750" y="570" text-anchor="middle" class="node-sub">设备全局上限：128 → 256</text>
</svg>
