<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17365d" flood-opacity="0.12"/></filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f78c4"/></marker>
    <style>text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700;fill:#102f52}.subtitle{font-size:18px;fill:#607a99}.node-title{font-size:23px;font-weight:700;fill:#14365c}.node-sub{font-size:16px;fill:#55708e}.line-label{font-size:17px;fill:#2f5f92}.callout-title{font-size:21px;font-weight:700;fill:#9b3c24}.callout-sub{font-size:16px;fill:#7c5260}</style>
  </defs>
  <rect width="1500" height="900" fill="#f7f9fc"/>
  <text x="60" y="65" class="title">Logical Path of the SIP Voice Service</text>
  <text x="60" y="100" class="subtitle">Call signaling completes, but RTP media does not establish bidirectionally</text>
  <rect x="495" y="135" width="510" height="88" rx="18" fill="#fff" stroke="#bdd2e8" stroke-width="2" filter="url(#shadow)"/><text x="750" y="170" text-anchor="middle" class="node-title">Office PC / IP Phone</text><text x="750" y="199" text-anchor="middle" class="node-sub">Originates or receives calls</text>
  <line x1="750" y1="223" x2="750" y2="290" stroke="#2f78c4" stroke-width="5" marker-end="url(#arrow-blue)"/><text x="785" y="263" class="line-label">SIP signaling + RTP voice</text>
  <rect x="495" y="300" width="510" height="88" rx="18" fill="#eaf3ff" stroke="#78a9db" stroke-width="2" filter="url(#shadow)"/><text x="750" y="335" text-anchor="middle" class="node-title">Registration VIP (Virtual Entry Point)</text><text x="750" y="364" text-anchor="middle" class="node-sub">Single entry point for registration and call requests</text>
  <line x1="750" y1="388" x2="750" y2="430" stroke="#2f78c4" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <rect x="495" y="440" width="510" height="88" rx="18" fill="#fff" stroke="#bdd2e8" stroke-width="2" filter="url(#shadow)"/><text x="750" y="475" text-anchor="middle" class="node-title">Registration FS (FreeSWITCH Cluster)</text><text x="750" y="504" text-anchor="middle" class="node-sub">Registration, call control, and media negotiation</text>
  <line x1="750" y1="528" x2="750" y2="570" stroke="#2f78c4" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <rect x="495" y="580" width="510" height="88" rx="18" fill="#fff" stroke="#bdd2e8" stroke-width="2" filter="url(#shadow)"/><text x="750" y="615" text-anchor="middle" class="node-title">Registration FS Backend</text><text x="750" y="644" text-anchor="middle" class="node-sub">Terminates the session and carries the RTP media</text>
  <line x1="750" y1="668" x2="750" y2="710" stroke="#2f78c4" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <rect x="495" y="720" width="510" height="70" rx="18" fill="#fff" stroke="#bdd2e8" stroke-width="2" filter="url(#shadow)"/><text x="750" y="764" text-anchor="middle" class="node-title">SIP Trunk Gateway</text>
  <line x1="750" y1="790" x2="750" y2="824" stroke="#2f78c4" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <rect x="495" y="834" width="510" height="54" rx="18" fill="#eaf8f0" stroke="#7ac69d" stroke-width="2"/><text x="750" y="869" text-anchor="middle" class="node-title">Carrier Voice Network / External Numbers</text>
  <rect x="1055" y="215" width="355" height="142" rx="18" fill="#fff4ef" stroke="#e46d4e" stroke-width="2" filter="url(#shadow)"/><text x="1232" y="255" text-anchor="middle" class="callout-title">Corporate Data Center Firewall</text><text x="1232" y="289" text-anchor="middle" class="callout-sub">Configuration change on the path</text><text x="1232" y="321" text-anchor="middle" class="callout-sub">SIP ALG: enabled → disabled</text><path d="M1055 286 C980 286 920 270 760 270" fill="none" stroke="#e46d4e" stroke-width="3" stroke-dasharray="8 7"/>
</svg>
