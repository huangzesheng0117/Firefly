<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1340" viewBox="0 0 1800 1340" role="img" aria-labelledby="title desc">
  <title id="title">End-to-End Logical Topology of the IDC Egress Network</title>
  <desc id="desc">The complete service path from customer servers through the access, distribution, core, and edge layers to the upstream carriers and the public Internet.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="business" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17334d" flood-opacity=".14"/>
    </filter>
    <marker id="peerArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .t{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#14283c}
      .title{font-size:31px;font-weight:700}
      .layer{font-size:14px;font-weight:700;fill:#64748b;letter-spacing:1px}
      .boxTitle{font-size:19px;font-weight:700}
      .boxSub{font-size:13px;fill:#607387}
      .white{fill:#fff}
      .internet{fill:#102a43;stroke:#102a43;stroke-width:2}
      .operator{fill:#fff;stroke:#cbd8e6;stroke-width:2}
      .routerBox{fill:url(#router)}
      .coreBox{fill:url(#core)}
      .businessBox{fill:url(#business);stroke:#cbd8e6;stroke-width:2}
      .monitorBox{fill:#fff7ed;stroke:#fb923c;stroke-width:2}
      .normal{fill:none;stroke:#64748b;stroke-width:3}
      .single{fill:none;stroke:#f59e0b;stroke-width:4}
      .peer{fill:none;stroke:#7c3aed;stroke-width:4;stroke-dasharray:9 7;marker-start:url(#peerArrow);marker-end:url(#peerArrow)}
      .monitor{fill:none;stroke:#f97316;stroke-width:2.5;stroke-dasharray:6 6}
      .small{font-size:12px;fill:#64748b}
    </style>
  </defs>
  <rect width="1800" height="1340" rx="26" fill="url(#bg)"/>
  <text x="70" y="55" text-anchor="start" class="t title">End-to-End Logical Topology of the IDC Egress Network</text>

  <rect x="650" y="82" width="500" height="68" rx="28" class="internet" filter="url(#shadow)"/>
  <text x="900" y="124" text-anchor="middle" class="t boxTitle white">Public Internet</text>
  <text x="70" y="190" text-anchor="start" class="t layer">UPSTREAM CARRIERS</text>
  <path d="M900 150 L185 220" class="normal"/><path d="M900 150 L530 220" class="normal"/><path d="M900 150 L875 220" class="normal"/><path d="M900 150 L1220 220" class="normal"/><path d="M900 150 L1565 220" class="normal"/>
  <rect x="50" y="220" width="270" height="78" rx="16" class="operator" filter="url(#shadow)"/><text x="185" y="267" text-anchor="middle" class="t boxTitle">China Telecom</text><rect x="395" y="220" width="270" height="78" rx="16" class="operator" filter="url(#shadow)"/><text x="530" y="267" text-anchor="middle" class="t boxTitle">China Unicom BGP</text><rect x="740" y="220" width="270" height="78" rx="16" class="operator" filter="url(#shadow)"/><text x="875" y="267" text-anchor="middle" class="t boxTitle">China Unicom Fixed-Route</text><rect x="1085" y="220" width="270" height="78" rx="16" class="operator" filter="url(#shadow)"/><text x="1220" y="267" text-anchor="middle" class="t boxTitle">China Mobile Shanghai</text><rect x="1430" y="220" width="270" height="78" rx="16" class="operator" filter="url(#shadow)"/><text x="1565" y="267" text-anchor="middle" class="t boxTitle">China Mobile Beijing</text>

  <path d="M185 298 C185 345 500 335 500 390" class="normal"/>
  <path d="M185 298 C185 355 1300 335 1300 390" class="normal"/>
  <path d="M530 298 C530 345 500 350 500 390" class="single"/>
  <path d="M875 298 C875 350 1300 345 1300 390" class="single"/>
  <path d="M1220 298 C1220 350 500 360 500 390" class="single"/>
  <path d="M1565 298 C1565 345 500 370 500 390" class="normal"/>
  <path d="M1565 298 C1565 350 1300 360 1300 390" class="normal"/>

  <text x="70" y="375" text-anchor="start" class="t layer">EDGE ROUTERS</text>
  <rect x="300" y="390" width="400" height="105" rx="18" class="routerBox" filter="url(#shadow)"/>
  <rect x="1100" y="390" width="400" height="105" rx="18" class="routerBox" filter="url(#shadow)"/>
  <text x="500" y="452" text-anchor="middle" class="t boxTitle white">H3C CR19000-1</text>
  <text x="1300" y="452" text-anchor="middle" class="t boxTitle white">H3C CR19000-2</text>
  <path d="M700 425 L1100 425" class="peer"/>
  <path d="M700 463 L1100 463" class="peer"/>
  <text x="900" y="414" text-anchor="middle" class="t small">Dual Interconnects</text>

  <text x="70" y="565" text-anchor="start" class="t layer">CORE LAYER</text>
  <path d="M500 495 C500 550 220 540 220 600" class="normal"/>
  <path d="M500 495 C500 550 590 540 590 600" class="normal"/>
  <path d="M1300 495 C1300 550 960 540 960 600" class="normal"/>
  <path d="M1300 495 C1300 550 1330 540 1330 600" class="normal"/>
  <rect x="70" y="600" width="300" height="90" rx="16" class="coreBox" filter="url(#shadow)"/>
  <rect x="440" y="600" width="300" height="90" rx="16" class="coreBox" filter="url(#shadow)"/>
  <rect x="810" y="600" width="300" height="90" rx="16" class="coreBox" filter="url(#shadow)"/>
  <rect x="1180" y="600" width="300" height="90" rx="16" class="coreBox" filter="url(#shadow)"/>
  <text x="220" y="653" text-anchor="middle" class="t boxTitle white">Single-Homed Core fixed-1</text>
  <text x="590" y="653" text-anchor="middle" class="t boxTitle white">Multihomed Core bgp-1</text>
  <text x="960" y="653" text-anchor="middle" class="t boxTitle white">Single-Homed Core fixed-2</text>
  <text x="1330" y="653" text-anchor="middle" class="t boxTitle white">Multihomed Core bgp-2</text>
  <path d="M370 630 C520 540 760 540 810 630" class="peer"/>
  <path d="M740 665 C900 750 1080 750 1180 665" class="peer"/>
  <text x="590" y="550" text-anchor="middle" class="t small">fixed Core Interconnect</text>
  <text x="960" y="752" text-anchor="middle" class="t small">BGP Core Interconnect</text>

  <rect x="1515" y="580" width="235" height="94" rx="16" class="monitorBox" filter="url(#shadow)"/>
  <text x="1632" y="620" text-anchor="middle" class="t boxTitle">Cacti</text>
  <text x="1632" y="649" text-anchor="middle" class="t boxSub">Link Traffic Monitoring</text>
  <path d="M1515 615 C1460 560 1410 525 1300 495" class="monitor"/>
  <path d="M1515 642 C1440 700 1350 715 1330 690" class="monitor"/>

  <text x="70" y="815" text-anchor="start" class="t layer">DISTRIBUTION LAYER</text>
  <path d="M220 690 C220 765 500 755 500 830" class="normal"/>
  <path d="M960 690 C960 765 500 755 500 830" class="normal"/>
  <path d="M590 690 C590 765 1300 755 1300 830" class="normal"/>
  <path d="M1330 690 C1330 765 1300 755 1300 830" class="normal"/>
  <rect x="250" y="830" width="500" height="82" rx="16" class="businessBox" filter="url(#shadow)"/>
  <rect x="1050" y="830" width="500" height="82" rx="16" class="businessBox" filter="url(#shadow)"/>
  <text x="500" y="880" text-anchor="middle" class="t boxTitle">Single-Homed Service Distribution</text>
  <text x="1300" y="880" text-anchor="middle" class="t boxTitle">Dual-Homed / Multi-Carrier Distribution</text>

  <text x="70" y="980" text-anchor="start" class="t layer">ACCESS LAYER</text>
  <path d="M500 912 L500 995" class="normal"/>
  <path d="M1300 912 L1300 995" class="normal"/>
  <rect x="250" y="995" width="500" height="82" rx="16" class="businessBox" filter="url(#shadow)"/>
  <rect x="1050" y="995" width="500" height="82" rx="16" class="businessBox" filter="url(#shadow)"/>
  <text x="500" y="1045" text-anchor="middle" class="t boxTitle">Single-Homed Customer Access Switches</text>
  <text x="1300" y="1045" text-anchor="middle" class="t boxTitle">Dual-Homed / BGP Customer Access Switches</text>

  <text x="70" y="1145" text-anchor="start" class="t layer">CUSTOMER SERVICES</text>
  <path d="M500 1077 L500 1160" class="normal"/>
  <path d="M1300 1077 L1300 1160" class="normal"/>
  <rect x="250" y="1160" width="500" height="82" rx="16" class="businessBox" filter="url(#shadow)"/>
  <rect x="1050" y="1160" width="500" height="82" rx="16" class="businessBox" filter="url(#shadow)"/>
  <text x="500" y="1210" text-anchor="middle" class="t boxTitle">Single-Homed Customer Servers</text>
  <text x="1300" y="1210" text-anchor="middle" class="t boxTitle">Dual-Homed / Multi-Carrier Customer Servers</text>

  <path d="M95 1290 L145 1290" class="normal"/>
  <text x="160" y="1295" text-anchor="start" class="t small">Service Link</text>
  <path d="M310 1290 L360 1290" class="single"/>
  <text x="375" y="1295" text-anchor="start" class="t small">Single-Homed Carrier Egress</text>
  <path d="M620 1290 L670 1290" class="peer"/>
  <text x="685" y="1295" text-anchor="start" class="t small">Device Interconnect</text>
  <path d="M875 1290 L925 1290" class="monitor"/>
  <text x="940" y="1295" text-anchor="start" class="t small">Monitoring Data Collection</text>
  </svg>
